<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네이버 클립 URL 변환기</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.mjs"></script>
</head>
<body>
  <main>
    <header>
      <span class="logo" aria-hidden="true">▶</span>
      <div><p class="eyebrow">영상 삽입 도우미</p><h1>네이버 클립 URL 변환기</h1></div>
    </header>
    <p class="intro">네이버 클립에서 복사한 내용을 붙여넣으세요.</p>
    <form id="converterForm">
      <label for="input">복사한 내용 붙여넣기</label>
      <textarea id="input" rows="3" spellcheck="false" placeholder="네이버 클립의 HTML복사 또는 링크 복사 내용" required></textarea>
      <div class="controls"><button type="submit" id="convertButton" class="primary">URL 추출 및 복사</button><button type="button" id="clearButton" class="secondary">비우기</button></div>
    </form>
    <p id="status" role="status" aria-live="polite">붙여넣은 뒤 버튼을 눌러 주세요.</p>
    <section id="result" hidden aria-label="변환 결과">
      <div class="result-heading"><label for="output">추출한 영상 URL</label><span id="typeBadge" class="badge"></span></div>
      <textarea id="output" rows="3" readonly spellcheck="false"></textarea>
      <p class="hint">복사한 주소를 WCMS 동영상 URL 입력란에 붙여넣으세요.</p>
    </section>
    <footer>
      <div><strong>경기일보 플랫폼운영지원부 남건우</strong></div>
      <span class="version">1.0.0.0 version</span>
    </footer>
  </main>
</body>
</html>
